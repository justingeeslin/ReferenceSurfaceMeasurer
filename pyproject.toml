[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-surface-measurer"
version = "0.1.0"
description = "Perspective-corrected object and garment measurement from photographs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
py-modules = ["ReferenceSurfaceMeasurer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["Test*.py", "test_*.py"]
